[project]
name = "nemoir-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.pyright]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "TRY003",
    "ANN401",
    "PLR0913",
    "BLE001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",
    "ARG001",
    "S108",
    "PLR2004",
    "PT011",
    "B017",
    "ANN001",
]
"tests/test_events.py" = ["PERF401"]
"tests/test_models.py" = ["PERF401"]
"tests/test_generated_package.py" = ["PERF401"]

[project]
name = "nemoir-runtime"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pyright>=1.1.0",
    "ruff>=0.1.0",
    "pytest>=7.0.0",
]

[tool.pyright]
typeCheckingMode = "strict"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "S101", "PLR2004", "INP001", "COM812"]
